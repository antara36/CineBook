<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CineBook | Login or Sign up</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><header class="site-header"><nav class="navbar container" aria-label="Main navigation"><a class="brand" href="auth.html"><span class="brand-mark">C</span><span>Cine<span class="brand-accent">Book</span></span></a><div class="nav-links"><a class="nav-link" href="auth.html">Login</a><a class="nav-link" href="auth.html">Please log in to browse</a></div><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button></nav></header>
<main><section class="page-heading container"><div class="eyebrow"><span class="eyebrow-dot"></span> YOUR CINEBOOK ACCOUNT</div><h1 id="authHeading">Welcome <span>back.</span></h1><p>Log in to continue your movie night, or create an account to get started.</p></section><section class="container auth-wrap"><div class="auth-panel"><div class="auth-switch auth-actions"><button type="button" class="button button-primary" id="showLogin">Login</button><button type="button" class="button button-secondary" id="showSignup">Sign up</button><select id="authMode" aria-label="Choose login or sign up" class="hidden"><option value="login">Log in</option><option value="signup">Sign up — new user</option></select></div><form id="authForm"><div class="form-field hidden" id="authNameField"><label for="authName">Full name</label><input id="authName" type="text" placeholder="Enter your name" maxlength="70"></div><div class="form-field"><label for="authEmail">Email address</label><input id="authEmail" type="email" placeholder="you@example.com" required maxlength="100"></div><div class="form-field" style="margin-top:16px"><label for="authPassword">Password</label><input id="authPassword" type="password" placeholder="At least 6 characters" required minlength="6" maxlength="100"></div><div id="authMessage" class="form-message hidden" role="status"></div><button class="button button-primary button-full" id="authSubmit" type="submit" style="margin-top:20px">Log in →</button><p class="form-footnote"></p></form></div></section></main><footer class="site-footer"><div class="container footer-inner"><a class="brand footer-brand" href="index.html"><span class="brand-mark">C</span><span>Cine<span class="brand-accent">Book</span></span></a><p>Made for movie lovers. © <span class="current-year"></span> CineBook</p><div class="footer-links"><a href="movies.html">Movies</a><a href="my-bookings.html">My Bookings</a></div></div></footer></body></html>
